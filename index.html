<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Kho hàng Thời gian thực</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <div class="w-64 bg-indigo-900 text-white flex flex-col">
            <div class="p-5 text-2xl font-bold tracking-wider border-b border-indigo-800 flex items-center gap-3">
                <i class="fa-solid fa-warehouse"></i> KhoHàng Pro
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full text-left px-4 py-3 rounded-lg bg-indigo-800 font-medium flex items-center gap-3 transition">
                    <i class="fa-solid fa-chart-pie w-5"></i> Tổng quan
                </button>
                <button onclick="switchTab('inventory')" id="nav-inventory" class="w-full text-left px-4 py-3 rounded-lg hover:bg-indigo-800 font-medium flex items-center gap-3 transition">
                    <i class="fa-solid fa-boxes-stacked w-5"></i> Danh mục Kho
                </button>
                <button onclick="switchTab('import')" id="nav-import" class="w-full text-left px-4 py-3 rounded-lg hover:bg-indigo-800 font-medium flex items-center gap-3 transition">
                    <i class="fa-solid fa-cart-plus w-5"></i> Nhập hàng
                </button>
                <button onclick="switchTab('export')" id="nav-export" class="w-full text-left px-4 py-3 rounded-lg hover:bg-indigo-800 font-medium flex items-center gap-3 transition">
                    <i class="fa-solid fa-truck-ramp-box w-5"></i> Xuất hàng
                </button>
                <button onclick="switchTab('history')" id="nav-history" class="w-full text-left px-4 py-3 rounded-lg hover:bg-indigo-800 font-medium flex items-center gap-3 transition">
                    <i class="fa-solid fa-clock-rotate-left w-5"></i> Lịch sử giao dịch
                </button>
            </nav>
            <div class="p-4 border-t border-indigo-800 text-xs text-indigo-300 text-center">
                Phiên bản 2.0 - Thời gian thực
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white shadow-sm p-4 flex justify-between items-center">
                <h1 id="page-title" class="text-xl font-bold text-gray-800">Tổng quan hệ thống</h1>
                <div class="flex items-center gap-3">
                    <span class="text-sm bg-green-100 text-green-700 px-3 py-1 rounded-full font-medium"><i class="fa-solid fa-circle text-xs text-green-500"></i> Đang hoạt động</span>
                </div>
            </header>

            <main class="p-6">
                <!-- TAB 1: DASHBOARD -->
                <div id="tab-dashboard" class="tab-content space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500 font-medium">Tổng sản phẩm trong kho</p>
                                <h3 id="stat-total-items" class="text-3xl font-bold text-gray-800 mt-1">0</h3>
                            </div>
                            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-box"></i></div>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500 font-medium">Tổng giá trị tồn kho</p>
                                <h3 id="stat-total-value" class="text-3xl font-bold text-gray-800 mt-1">0 ₫</h3>
                            </div>
                            <div class="w-12 h-12 bg-green-50 text-green-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-money-bill-wave"></i></div>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500 font-medium">Giao dịch gần đây</p>
                                <h3 id="stat-total-tx" class="text-3xl font-bold text-gray-800 mt-1">0</h3>
                            </div>
                            <div class="w-12 h-12 bg-purple-50 text-purple-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-receipt"></i></div>
                        </div>
                    </div>
                </div>

                <!-- TAB 2: INVENTORY -->
                <div id="tab-inventory" class="tab-content hidden space-y-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-bold text-gray-800">Thêm sản phẩm mới</h3>
                        </div>
                        <form id="add-product-form" onsubmit="addProduct(event)" class="grid grid-cols-1 md:grid-cols-5 gap-4">
                            <input type="text" id="p-sku" placeholder="Mã SKU (VD: SP001)" required class="border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <input type="text" id="p-name" placeholder="Tên sản phẩm" required class="border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <input type="number" id="p-price" placeholder="Giá tiền (₫)" required class="border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <input type="number" id="p-qty" placeholder="Số lượng ban đầu" required class="border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <button type="submit" class="bg-indigo-600 text-white font-medium rounded-lg px-4 py-2 hover:bg-indigo-700 transition">Thêm sản phẩm</button>
                        </form>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-600 border-b border-gray-200 text-sm">
                                    <th class="p-4">Mã SKU</th>
                                    <th class="p-4">Tên sản phẩm</th>
                                    <th class="p-4">Giá tiền</th>
                                    <th class="p-4">Tồn kho</th>
                                    <th class="p-4 text-center">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="inventory-table-body" class="divide-y divide-gray-200 text-sm">
                                <!-- Dữ liệu tự động điền -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- TAB 3: IMPORT -->
                <div id="tab-import" class="tab-content hidden space-y-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 max-w-xl mx-auto">
                        <h3 class="text-lg font-bold text-gray-800 mb-4">Phiếu Nhập Hàng</h3>
                        <form onsubmit="handleTransaction(event, 'IMPORT')" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Chọn sản phẩm</label>
                                <select id="import-product-select" class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" required></select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Số lượng nhập</label>
                                <input type="number" id="import-qty" min="1" placeholder="Nhập số lượng..." class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
                            </div>
                            <button type="submit" class="w-full bg-green-600 text-white font-medium rounded-lg py-3 hover:bg-green-700 transition">Xác Nhận Nhập Kho</button>
                        </form>
                    </div>
                </div>

                <!-- TAB 4: EXPORT -->
                <div id="tab-export" class="tab-content hidden space-y-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 max-w-xl mx-auto">
                        <h3 class="text-lg font-bold text-gray-800 mb-4">Phiếu Xuất Hàng</h3>
                        <form onsubmit="handleTransaction(event, 'EXPORT')" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Chọn sản phẩm</label>
                                <select id="export-product-select" class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" required></select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Số lượng xuất</label>
                                <input type="number" id="export-qty" min="1" placeholder="Nhập số lượng..." class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
                            </div>
                            <button type="submit" class="w-full bg-orange-600 text-white font-medium rounded-lg py-3 hover:bg-orange-700 transition">Xác Nhận Xuất Kho</button>
                        </form>
                    </div>
                </div>

                <!-- TAB 5: HISTORY -->
                <div id="tab-history" class="tab-content hidden space-y-6">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-600 border-b border-gray-200 text-sm">
                                    <th class="p-4">Thời gian</th>
                                    <th class="p-4">Loại giao dịch</th>
                                    <th class="p-4">Sản phẩm</th>
                                    <th class="p-4">Số lượng</th>
                                </tr>
                            </thead>
                            <tbody id="history-table-body" class="divide-y divide-gray-200 text-sm">
                                <!-- Lịch sử giao dịch -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // Khởi tạo dữ liệu mẫu nếu chưa có
        let products = JSON.parse(localStorage.getItem('kho_products')) || [
            { sku: 'SKU01', name: 'Áo thun nam', price: 150000, qty: 50 },
            { sku: 'SKU02', name: 'Quần Jean nam', price: 350000, qty: 30 }
        ];

        let history = JSON.parse(localStorage.getItem('kho_history')) || [];

        function saveData() {
            localStorage.setItem('kho_products', JSON.stringify(products));
            localStorage.setItem('kho_history', JSON.stringify(history));
            updateUI();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('bg-indigo-800'));
            
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            document.getElementById('nav-' + tabId).classList.add('bg-indigo-800');

            const titles = {
                'dashboard': 'Tổng quan hệ thống',
                'inventory': 'Danh mục Kho hàng',
                'import': 'Nhập hàng vào kho',
                'export': 'Xuất hàng khỏi kho',
                'history': 'Lịch sử giao dịch thời gian thực'
            };
            document.getElementById('page-title').innerText = titles[tabId];
            updateUI();
        }

        function addProduct(e) {
            e.preventDefault();
            const sku = document.getElementById('p-sku').value.trim();
            const name = document.getElementById('p-name').value.trim();
            const price = Number(document.getElementById('p-price').value);
            const qty = Number(document.getElementById('p-qty').value);

            if(products.some(p => p.sku === sku)) {
                alert('Mã SKU này đã tồn tại!');
                return;
            }

            products.push({ sku, name, price, qty });
            history.unshift({ time: new Date().toLocaleString(), type: 'THÊM MỚI', name, qty });
            saveData();
            document.getElementById('add-product-form').reset();
            alert('Thêm sản phẩm thành công!');
        }

        function deleteProduct(sku) {
            if(confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')) {
                products = products.filter(p => p.sku !== sku);
                saveData();
            }
        }

        function handleTransaction(e, type) {
            e.preventDefault();
            const selectId = type === 'IMPORT' ? 'import-product-select' : 'export-product-select';
            const qtyId = type === 'IMPORT' ? 'import-qty' : 'export-qty';
            
            const sku = document.getElementById(selectId).value;
            const amount = Number(document.getElementById(qtyId).value);

            const product = products.find(p => p.sku === sku);
            if(!product) return;

            if(type === 'EXPORT' && product.qty < amount) {
                alert('Số lượng tồn kho không đủ để xuất!');
                return;
            }

            if(type === 'IMPORT') {
                product.qty += amount;
            } else {
                product.qty -= amount;
            }

            history.unshift({
                time: new Date().toLocaleString(),
                type: type === 'IMPORT' ? 'NHẬP HÀNG' : 'XUẤT HÀNG',
                name: product.name,
                qty: amount
            });

            saveData();
            e.target.reset();
            alert(type === 'IMPORT' ? 'Nhập hàng thành công!' : 'Xuất hàng thành công!');
        }

        function updateUI() {
            // Dashboard stats
            let totalItems = products.reduce((sum, p) => sum + p.qty, 0);
            let totalValue = products.reduce((sum, p) => sum + (p.qty * p.price), 0);
            document.getElementById('stat-total-items').innerText = totalItems;
            document.getElementById('stat-total-value').innerText = totalValue.toLocaleString() + ' ₫';
            document.getElementById('stat-total-tx').innerText = history.length;

            // Inventory table
            let invHtml = '';
            products.forEach(p => {
                invHtml += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-4 font-medium text-gray-900">${p.sku}</td>
                        <td class="p-4">${p.name}</td>
                        <td class="p-4">${p.price.toLocaleString()} ₫</td>
                        <td class="p-4 font-semibold text-indigo-600">${p.qty}</td>
                        <td class="p-4 text-center">
                            <button onclick="deleteProduct('${p.sku}')" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('inventory-table-body').innerText = ''; // clear
            document.getElementById('inventory-table-body').innerHTML = invHtml;

            // Select dropdowns
            let selectHtml = '';
            products.forEach(p => {
                selectHtml += `<option value="${p.sku}">${p.name} (Tồn: ${p.qty})</option>`;
            });
            document.getElementById('import-product-select').innerHTML = selectHtml;
            document.getElementById('export-product-select').innerHTML = selectHtml;

            // History table
            let histHtml = '';
            history.forEach(h => {
                let badgeColor = h.type === 'NHẬP HÀNG' ? 'bg-green-100 text-green-700' : (h.type === 'XUẤT HÀNG' ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700');
                histHtml += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-4 text-gray-500 text-xs">${h.time}</td>
                        <td class="p-4"><span class="px-2 py-1 rounded-full text-xs font-bold ${badgeColor}">${h.type}</span></td>
                        <td class="p-4 font-medium text-gray-900">${h.name}</td>
                        <td class="p-4 font-bold">${h.qty}</td>
                    </tr>
                `;
            });
            document.getElementById('history-table-body').innerHTML = histHtml;
        }

        // Khởi chạy ban đầu
        updateUI();
    </script>
</body>
</html>
